[project]
name = "healthcare-revenue-cycle-agent-google-adk"
version = "1.0.0"
description = "Healthcare billing workflow built with Google ADK and Google Cloud."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "aiosqlite>=0.21.0,<1.0.0",
    "fastapi>=0.118.0,<1.0.0",
    "google-adk[a2a]>=2.3.0,<3.0.0",
    "gradio>=5.49.0,<7.0.0",
    "httpx[socks]>=0.28.1,<1.0.0",
    "mcp>=1.27.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
